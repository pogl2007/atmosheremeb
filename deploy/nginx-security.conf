# Заголовки безопасности для atmospheremeb.ru.
#
# Подключение: положить в /etc/nginx/snippets/atmosfera-security.conf и в блоке
# server { listen 443 ... } написать:
#     include snippets/atmosfera-security.conf;
# Проверить и применить:  nginx -t && systemctl reload nginx
#
# ВАЖНО про add_header в nginx: если внутри location есть хоть один свой
# add_header, заголовки уровня server в этот location НЕ наследуются.
# Поэтому в таких location (например, со статикой и Cache-Control) этот
# файл нужно подключить ещё раз.

# HTTPS на год вперёд. Было 30 дней — после истечения первый заход по http
# снова можно перехватить. includeSubDomains не ставим, пока не проверено,
# что все поддомены работают по https.
add_header Strict-Transport-Security "max-age=31536000" always;

# Политика источников. Скриптов внутри HTML на сайте больше нет (обработчики
# onclick заменены на data-click), поэтому разрешаем только свои файлы:
# внедрённый в страницу <script> или onerror= браузер не выполнит.
#  - style 'unsafe-inline' — в разметке есть атрибуты style="…";
#  - fonts.googleapis.com / fonts.gstatic.com — шрифты. Если перенести шрифты
#    на свой сервер, эти два адреса надо убрать;
#  - если подключите Яндекс Метрику, добавьте https://mc.yandex.ru
#    в script-src, img-src и connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Камера, микрофон, геолокация сайту не нужны — запрещаем и встроенным фреймам
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Версию nginx в ответах не показываем
server_tokens off;

# ── location /admin/ — обязательно ──
# Админка сама ставит более строгие заголовки: CSP с разовым ключом (nonce)
# для своих скриптов и X-Frame-Options: DENY. Если сюда долетит ещё и общий
# CSP выше, браузер применит ОБА, и script-src 'self' заблокирует скрипты
# админки (кнопка «Показать пароль», подтверждение удаления).
# Поэтому в location /admin/ должен быть свой add_header — тогда заголовки
# уровня server туда не наследуются:
#
#     limit_req_zone $binary_remote_addr zone=admin:1m rate=10r/m;   # в http {}
#
#     location /admin/ {
#         limit_req zone=admin burst=5 nodelay;   # бекенд тоже режет: 5 попыток за 10 минут
#         add_header Strict-Transport-Security "max-age=31536000" always;
#         proxy_pass http://unix:/run/atmosfera/atmosfera.sock;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-Proto $scheme;   # без него кука сессии будет без Secure
#     }
